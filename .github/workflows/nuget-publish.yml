name: NuGet Packaging and Pushing to NuGet.org

# See https://tehgm.net/blog/nuget-github-actions/ for explanations

on:
  push:
    branches: [ main ]
    
defaults:
  run:
    working-directory: src

jobs:
  nuget-publish:

    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v2
    - name: Check path
      run: echo ${{ github.workspace }} 
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      with:
        # The preferred processor architecture of MSBuild. Can be either "x86" or "x64". "x64" is only available from Visual Studio version 17.0 and later.
        msbuild-architecture: x64
    - name: Build and restore
      run: msbuild -restore -p:Configuration=Pack ${{ github.workspace }}\src\PiWeb.Volume.sln
    - name: Publish
      run: |
        msbuild -t:pack -p:Configuration=Pack -p:Platform=AnyCPU ${{ github.workspace }}\src\PiWeb.Volume\PiWeb.Volume.csproj 
    - name: NuGet login
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Push packages to NuGet.org
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push ${{ github.workspace }}\bin\Pack\*.nupkg --skip-duplicate --no-symbols true --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
